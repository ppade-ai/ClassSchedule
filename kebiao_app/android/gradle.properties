org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 关闭 AGP 的"路径含非 ASCII 字符"拦截。
# 背景：仓库根目录名为「课表App」（中文），AGP 9.x 默认拒绝在此类路径下构建：
#   "Your project path contains non-ASCII characters ... Please move your project
#    to a different directory ... This warning can be disabled by adding the line
#    'android.overridePathCheck=true' to gradle.properties"
# 本项目无原生 C/C++ 代码（纯 Dart + Kotlin，且 useLegacyPackaging=true），
# 因此该检查所防范的风险不适用。若将来引入 native 依赖，请优先把仓库根目录
# 改成纯 ASCII 名（如 TimetableApp），而不是长期依赖此开关。
android.overridePathCheck=true
